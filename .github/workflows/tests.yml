name: tests

on:
  push:
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # Laravel 11 is not in the matrix: Packagist blocks every 11.x release
        # on open security advisories (2026-09-23), so it cannot be installed
        # without switching that check off — and a package should not ask that.
        laravel: ['12.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, simplexml
          coverage: none
      - run: composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest
